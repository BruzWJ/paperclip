name: Release Smoke

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source commit containing the matching smoke contract
        required: true
        default: master
        type: string
      paperclip_version:
        description: Published Paperclip version or dist-tag to inspect
        required: true
        default: canary
        type: choice
        options:
          - canary
          - latest
      artifact_name:
        description: Artifact name for uploaded diagnostics
        required: false
        default: release-smoke
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      paperclip_version:
        required: true
        type: string
      artifact_name:
        required: false
        default: release-smoke
        type: string

jobs:
  production_boundaries:
    name: Production boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Checkout pinned Session design reference
        uses: actions/checkout@v7
        with:
          repository: anomalyco/opencode
          ref: 2b2aacc93975330f9fd045d4306f698b0c6a8f8f
          path: reference/opencode

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run canonical production gates and gate self-tests
        env:
          OPENCODE_SESSION_DONOR: ${{ github.workspace }}/reference/opencode
        run: pnpm run check:production-boundaries

  smoke:
    needs: [production_boundaries]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify source package and release contracts
        run: |
          pnpm build
          pnpm run test:release-registry
          pnpm run test:release-smoke

      - name: Inspect the published package without starting Paperclip
        env:
          PAPERCLIPAI_VERSION: ${{ inputs.paperclip_version }}
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/paperclip-published-package"
          mkdir -p "$package_dir"
          npm pack "paperclipai@$PAPERCLIPAI_VERSION" \
            --pack-destination "$package_dir" \
            --json >"$RUNNER_TEMP/paperclip-pack.json"
          archive="$(node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!Array.isArray(result) || result.length !== 1 || !result[0].filename) process.exit(1);
            process.stdout.write(result[0].filename);
          ' "$RUNNER_TEMP/paperclip-pack.json")"
          tar -tf "$package_dir/$archive" | sort >"$RUNNER_TEMP/paperclip-package-files.txt"
          grep -qx 'package/package.json' "$RUNNER_TEMP/paperclip-package-files.txt"
          grep -Eq '^package/dist/.+\.js$' "$RUNNER_TEMP/paperclip-package-files.txt"
          retired_runtime='embed''ded-postgres'
          optional_driver='pg''lite'
          retired_test_harness='test-''postgres'
          forbidden_artifacts="${retired_runtime}|${optional_driver}|${retired_test_harness}"
          if grep -Eiq "$forbidden_artifacts" "$RUNNER_TEMP/paperclip-package-files.txt"; then
            echo "Published package contains a forbidden database test/runtime artifact." >&2
            exit 1
          fi

      - name: Build and inspect the canonical container artifact
        run: |
          docker build \
            --build-arg USER_UID="$(id -u)" \
            --build-arg USER_GID="$(id -g)" \
            -f Dockerfile \
            -t paperclip-release-artifact-smoke .
          docker image inspect paperclip-release-artifact-smoke \
            >"$RUNNER_TEMP/paperclip-image-inspect.json"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            ${{ runner.temp }}/paperclip-pack.json
            ${{ runner.temp }}/paperclip-package-files.txt
            ${{ runner.temp }}/paperclip-image-inspect.json
          retention-days: 14
