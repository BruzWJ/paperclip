services:
  review-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: paperclip_review
      POSTGRES_USER: paperclip_review
      POSTGRES_PASSWORD: paperclip_review
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U paperclip_review -d paperclip_review
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - review-db:/var/lib/postgresql/data

  review:
    build:
      context: ..
      dockerfile: docker/untrusted-review/Dockerfile
    init: true
    tty: true
    stdin_open: true
    working_dir: /work
    environment:
      HOME: "/home/reviewer"
      CODEX_HOME: "/home/reviewer/.codex"
      CLAUDE_HOME: "/home/reviewer/.claude"
      PAPERCLIP_HOME: "/home/reviewer/.paperclip-review"
      DATABASE_URL: "postgres://paperclip_review:paperclip_review@review-db:5432/paperclip_review"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    ports:
      - "${REVIEW_PAPERCLIP_PORT:-3100}:3100"
      - "${REVIEW_VITE_PORT:-5173}:5173"
    volumes:
      - review-home:/home/reviewer
      - review-work:/work
    depends_on:
      review-db:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=1g

volumes:
  review-db:
  review-home:
  review-work:
