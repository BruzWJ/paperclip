# Quickstart: Paperclip with a PostgreSQL service.
# Copy this file and set the required env vars before running.
#
#   cd docker
#   export BETTER_AUTH_SECRET="$(openssl rand -hex 32)"
#   docker compose -f docker-compose.quickstart.yml up --build
#
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: paperclip
      POSTGRES_DB: paperclip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - quickstart-pgdata:/var/lib/postgresql/data

  paperclip:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "${PAPERCLIP_PORT:-3100}:3100"
    environment:
      PAPERCLIP_BIND: "lan"
      PAPERCLIP_HOME: "/paperclip"
      DATABASE_URL: "postgres://paperclip:paperclip@db:5432/paperclip"

      # ── Reachability and exposure ──
      # "private" = loopback/private network, "public" = internet-facing (use with TLS)
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      # Public deployments must also set PAPERCLIP_PUBLIC_URL to their one exact HTTPS origin.

      # ── Required secret for session signing (generate with: openssl rand -hex 32) ──
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      # Persistent application data (agent workspaces and uploads)
      - "${PAPERCLIP_DATA_DIR:-../data/docker-paperclip}:/paperclip"
    depends_on:
      db:
        condition: service_healthy

volumes:
  quickstart-pgdata:
